[project]
name = "cloud-native-ai-backend"
version = "0.1.0"
description = "Secure asynchronous backend foundations for trustworthy AI workloads."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008"]

[tool.mypy]
strict = true
