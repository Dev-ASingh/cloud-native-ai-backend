AWSTemplateFormatVersion: "2010-09-09"
Description: On-demand Flagship 01 demonstration stack. Delete the stack after use.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  DemoBudgetEmail:
    Type: String
    Description: Email address for AWS budget notifications.

Resources:
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP API port for the temporary demo only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: DemoStack
          Value: flagship-01

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref DemoSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          git clone --depth 1 https://github.com/Dev-ASingh/cloud-native-ai-backend.git /opt/cloud-native-ai-backend
          cd /opt/cloud-native-ai-backend
          docker compose up --build --detach
          docker compose run --rm api alembic upgrade head
      Tags:
        - Key: Name
          Value: flagship-01-demo
        - Key: DemoStack
          Value: flagship-01

  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 5
          Unit: USD
        BudgetName: flagship-01-demo-budget
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:DemoStack$flagship-01
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref DemoBudgetEmail
              SubscriptionType: EMAIL

Outputs:
  ApiUrl:
    Description: Temporary API URL. Delete the stack after the demonstration.
    Value: !Sub http://${DemoInstance.PublicIp}:8000/api/v1
  InstanceId:
    Value: !Ref DemoInstance
  StackWarning:
    Description: This stack is intentionally temporary and must be deleted after use.
    Value: DELETE_THIS_STACK_AFTER_THE_DEMO
