services:
  - type: web
    name: cloud-native-ai-backend-api
    runtime: docker
    repo: https://github.com/Dev-ASingh/cloud-native-ai-backend
    branch: main
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    dockerCommand: uvicorn cloud_native_ai_backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_DATABASE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-native-ai-backend-db
          property: connectionString
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "1.0"

  - type: worker
    name: cloud-native-ai-backend-worker
    runtime: docker
    repo: https://github.com/Dev-ASingh/cloud-native-ai-backend
    branch: main
    dockerCommand: python -m cloud_native_ai_backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_DATABASE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-native-ai-backend-db
          property: connectionString
      - key: WORKER_ID
        value: render-worker
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "1.0"

  - type: pserv
    name: cloud-native-ai-backend-db
    runtime: image
    image:
      url: docker.io/library/postgres:16-alpine
    disk:
      name: cloud-native-ai-backend-db-disk
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_DB
        value: backend
      - key: POSTGRES_USER
        value: backend
      - key: POSTGRES_PASSWORD
        generateValue: true
