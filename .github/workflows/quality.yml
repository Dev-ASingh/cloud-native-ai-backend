name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://backend:backend@localhost:5432/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest
      - name: Check formatting and lint
        run: ruff check .
      - name: Check types
        run: mypy src tests
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit
      - name: Scan tracked files for credentials
        run: python scripts/check_secrets.py
      - name: Build container
        run: docker build --tag cloud-native-ai-backend:${{ github.sha }} .
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-ai-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Smoke test container
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 8000:8000 cloud-native-ai-backend:${{ github.sha }})"
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
